[package]
name = "esp32-s31-korovo1-conways-game-of-life"
version = "0.7.0"
authors = ["Juraj Michálek <juraj.michalek@espressif.com>", "Matěj David Ondráček <mathejdo@seznam.cz>"]
edition = "2024"
license = "MIT OR Apache-2.0"

# Empty workspace to avoid being part of parent workspace
[workspace]

[dependencies]

embedded-graphics   = "0.8.2"
esp-hal                 = {git = "https://github.com/esp-rs/esp-hal.git", rev = "8a70d09fe0065d5387dac82e4fbe937e95e496e1", features = ["esp32s31",]}
esp-backtrace           = {git = "https://github.com/esp-rs/esp-hal.git", rev = "8a70d09fe0065d5387dac82e4fbe937e95e496e1", features = ["panic-handler","println"]}
esp-bootloader-esp-idf  = {git = "https://github.com/esp-rs/esp-hal.git", rev = "8a70d09fe0065d5387dac82e4fbe937e95e496e1", features = ["esp32s31"] }
esp-println             = {git = "https://github.com/esp-rs/esp-hal.git", rev = "8a70d09fe0065d5387dac82e4fbe937e95e496e1", features = ["log-04"] }
esp-alloc               = {git = "https://github.com/esp-rs/esp-hal.git", rev = "8a70d09fe0065d5387dac82e4fbe937e95e496e1", features = ["esp32s31"]}


[features]
default = [ "esp-hal/esp32s31", "esp-backtrace/esp32s31", "esp-println/esp32s31" ]
